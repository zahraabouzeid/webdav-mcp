name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/webdav-mcp

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Server
    needs: image
    if: vars.SSH_TARGET != ''
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ vars.SSH_TARGET }}
      FOLDER: ${{ vars.DEPLOY_FOLDER }}
    steps:
      - uses: actions/checkout@v4
      - env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - env:
          PUBLIC_HOST: ${{ vars.DOMAIN }}
        run: |
          umask 077
          printf 'PUBLIC_HOST=%s\n' "$PUBLIC_HOST" > .env
      - run: ssh "$TARGET" "mkdir -p $FOLDER"
      - run: scp .env docker-compose.yml "$TARGET:$FOLDER/"
      - env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | ssh "$TARGET" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "$TARGET" "cd $FOLDER && docker network inspect web > /dev/null 2>&1 || docker network create web; docker compose pull && docker compose up -d; status=\$?; docker logout ghcr.io; docker image prune -f; exit \$status"
